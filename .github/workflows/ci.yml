name: CI

# Minimal CI for a private repo — one job on pushes to main.
# Dogfoods Ship Happens: it builds the `ship` CLI, then runs the repo's own
# pipeline (ci/pipeline.pkl) which does the vet/test/cover/build/validate.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ship-it:
    name: ship builds ship
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Install pkl
        run: |
          curl -fsSL -o /usr/local/bin/pkl \
            https://github.com/apple/pkl/releases/latest/download/pkl-linux-amd64
          chmod +x /usr/local/bin/pkl
          pkl --version

      - name: Build ship
        run: go build -o bin/ship ./cmd/ship

      - name: ship builds ship 🚢
        run: ./bin/ship run ci/pipeline.pkl --no-tui
