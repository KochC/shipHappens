name: CI

# Manual-only backup. Day-to-day CI runs LOCALLY via `ship run ci/pipeline.pkl`
# (and the pre-push git hook). This workflow is kept as a thin, on-demand
# fallback — trigger it from the Actions tab ("Run workflow") when you want a
# clean-VM check. It does not run automatically, so it never duplicates the
# local pipeline.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ship-it:
    name: ship builds ship
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Install pkl
        run: |
          curl -fsSL -o /usr/local/bin/pkl \
            https://github.com/apple/pkl/releases/latest/download/pkl-linux-amd64
          chmod +x /usr/local/bin/pkl
          pkl --version

      - name: Build ship
        run: go build -o bin/ship ./cmd/ship

      - name: ship builds ship 🚢
        run: ./bin/ship run ci/pipeline.pkl --no-tui
