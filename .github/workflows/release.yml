name: Release

on:
  push:
    tags:
      - 'v*'      # binaries
      - 'pkl-v*'  # Pkl schema package

permissions:
  contents: write  # create releases + upload assets

jobs:
  release:
    name: build & publish ship binaries
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Build cross-platform binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          LDFLAGS="-s -w -X main.version=${VERSION}"
          build() {
            local cmd="$1" os="$2" arch="$3" ext="${4:-}"
            local out="${cmd}_${VERSION}_${os}_${arch}${ext}"
            echo "building $out"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
              go build -trimpath -ldflags "$LDFLAGS" -o "dist/${out}" ./cmd/${cmd}
          }
          for target in "linux amd64" "linux arm64" "darwin amd64" "darwin arm64"; do
            set -- $target
            build ship        "$1" "$2"
            build ship-mcp    "$1" "$2"
            build ship-egress "$1" "$2"
          done
          build ship        windows amd64 .exe
          build ship-mcp    windows amd64 .exe
          build ship-egress windows amd64 .exe

      - name: Checksums
        working-directory: dist
        run: sha256sum ship_* ship-mcp_* ship-egress_* > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/ship_*
            dist/ship-mcp_*
            dist/ship-egress_*
            dist/checksums.txt

  pkl-package:
    name: build & publish Pkl schema package
    if: startsWith(github.ref_name, 'pkl-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pkl
        run: |
          curl -fsSL -o /usr/local/bin/pkl \
            https://github.com/apple/pkl/releases/download/0.28.2/pkl-linux-amd64
          chmod +x /usr/local/bin/pkl
          pkl --version

      - name: Package the Pkl schema
        run: pkl project package pkl/ --output-path dist/pkl

      # The tag pkl-vX.Y.Z must match the version in pkl/PklProject, so the
      # package's packageZipUrl (…/releases/download/pkl-vX.Y.Z/…) resolves.
      - name: Create GitHub Release (Pkl package)
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/pkl/shiphappens@*.zip
            dist/pkl/shiphappens@*.zip.sha256
            dist/pkl/shiphappens@*.sha256
            dist/pkl/shiphappens@*
