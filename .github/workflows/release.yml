name: Release

# Manual-only backup. Releases are normally cut LOCALLY (and auto-versioned)
# via `ship run ci/release.pkl` / `ci/release-pkl.pkl` — see docs/RELEASING.md.
# This workflow is a thin, on-demand fallback: trigger it from the Actions tab,
# choosing what to publish and the version tag. It never runs automatically, so
# it can't duplicate a local release.
on:
  workflow_dispatch:
    inputs:
      target:
        description: What to release
        type: choice
        options: [binaries, pkl-package]
        default: binaries
      version:
        description: 'Version tag (binaries: vX.Y.Z · pkl-package: pkl-vX.Y.Z)'
        required: true

permissions:
  contents: write  # create releases + upload assets

jobs:
  release:
    name: build & publish ship binaries
    if: inputs.target == 'binaries'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Build cross-platform binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          LDFLAGS="-s -w -X main.version=${VERSION}"
          build() {
            local cmd="$1" os="$2" arch="$3" ext="${4:-}"
            local out="${cmd}_${VERSION}_${os}_${arch}${ext}"
            echo "building $out"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
              go build -trimpath -ldflags "$LDFLAGS" -o "dist/${out}" ./cmd/${cmd}
          }
          for target in "linux amd64" "linux arm64" "darwin amd64" "darwin arm64"; do
            set -- $target
            build ship        "$1" "$2"
            build ship-mcp    "$1" "$2"
            build ship-egress "$1" "$2"
          done
          build ship        windows amd64 .exe
          build ship-mcp    windows amd64 .exe
          build ship-egress windows amd64 .exe

      - name: Checksums
        working-directory: dist
        run: sha256sum ship_* ship-mcp_* ship-egress_* > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          generate_release_notes: true
          files: |
            dist/ship_*
            dist/ship-mcp_*
            dist/ship-egress_*
            dist/checksums.txt

  pkl-package:
    name: build & publish Pkl schema package
    if: inputs.target == 'pkl-package'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pkl
        run: |
          curl -fsSL -o /usr/local/bin/pkl \
            https://github.com/apple/pkl/releases/download/0.28.2/pkl-linux-amd64
          chmod +x /usr/local/bin/pkl
          pkl --version

      - name: Package the Pkl schema
        run: pkl project package pkl/ --output-path dist/pkl

      # The tag pkl-vX.Y.Z must match the version in pkl/PklProject, so the
      # package's packageZipUrl (…/releases/download/pkl-vX.Y.Z/…) resolves.
      - name: Create GitHub Release (Pkl package)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          generate_release_notes: true
          files: |
            dist/pkl/shiphappens@*.zip
            dist/pkl/shiphappens@*.zip.sha256
            dist/pkl/shiphappens@*.sha256
            dist/pkl/shiphappens@*
